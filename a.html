
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課題の登録・編集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header>
      <button type="button" class="close" onclick="resetForm()">×</button>
      <h2 id="formTitle">課題を追加</h2>
    </header>

    <form id="taskForm">
      <label for="taskName">課題名</label>
      <input type="text" id="taskName"
        placeholder="例：データ分析レポート" required>

      <label for="subject">科目</label>
      <select id="subject">
        <option>統計学</option>
        <option>英語</option>
        <option>情報デザイン</option>
        <option>数学</option>
        <option>国語</option>
        <option>その他</option>
      </select>

      <label for="deadline">締切</label>
      <input type="date" id="deadline" required>

      <label for="time">予想所要時間</label>
      <select id="time">
        <option>約30分</option>
        <option>約1時間</option>
        <option selected>約2時間</option>
        <option>約3時間</option>
        <option>約4時間以上</option>
      </select>

      <label>ステータス</label>
      <div class="status">
        <button type="button" class="status-btn active"
          data-status="まだ">まだ</button>
        <button type="button" class="status-btn"
          data-status="途中">途中</button>
        <button type="button" class="status-btn"
          data-status="完了">完了</button>
      </div>

      <button type="submit" class="register" id="submitBtn">
        登録
      </button>
    </form>

    <h3>登録した課題</h3>
    <div id="taskList"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
