<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定 | AI課題プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>得意・苦手を登録</h1>
<p class="lead">得意・苦手を教えてください。AIがあなたに合った学習計画を提案します。いつでも変更できます。</p>
<form class="card" action="#" method="post" style="max-width:640px">
  <div class="skill"><b>レポート作成</b><div class="seg"><input type="radio" name="m" id="m1"><label for="m1">得意</label><input type="radio" name="m" id="m2"><label for="m2">ふつう</label><input type="radio" name="m" id="m3" checked><label for="m3">苦手</label></div></div>
  <div class="skill"><b>プログラミング</b><div class="seg"><input type="radio" name="e" id="e1"><label for="e1">得意</label><input type="radio" name="e" id="e2" checked><label for="e2">ふつう</label><input type="radio" name="e" id="e3"><label for="e3">苦手</label></div></div>
  <div class="skill"><b>デザイン制作</b><div class="seg"><input type="radio" name="k" id="k1"><label for="k1">得意</label><input type="radio" name="k" id="k2" checked><label for="k2">ふつう</label><input type="radio" name="k" id="k3"><label for="k3">苦手</label></div></div>
  <p><a href="#">＋ そのほかの項目を追加</a></p>
  <div class="actions"><button class="btn" type="submit">保存してホームへ</button></div>
</form>
</main>
</body>
</html>
