<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI課題プランナー</title>

    <!-- 初めて使うときは、先に設定ページへ移動する -->
    <script>
        try {
            if (!localStorage.getItem("plannerSetupDone")) {
                location.replace("setting.html");
            }
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
</head>


<body>

<header class="app-header">
  <div class="app-logo">AI課題プランナー</div>
</header>

  <main class="container">

      <!-- 今日やること -->
      <section class="today-card">
          <p class="today-label">今日やることは</p>
          <h1 class="today-task" id="today-task">読み込み中…</h1>
          <p class="today-end" id="today-end">です！</p>
      </section>

      <!-- メニュー(各ページへのリンク) -->
      <nav class="menu-grid" aria-label="メニュー">
          <a href="ai.html" class="menu-card menu-primary">
              <span class="menu-icon">✧</span>
              <span class="menu-name">AIの学習提案</span>
              <span class="menu-desc">優先順位と予定を提案</span>
          </a>
          <a href="task.html" class="menu-card">
              <span class="menu-icon">📝</span>
              <span class="menu-name">課題を登録</span>
              <span class="menu-desc">追加・編集・削除</span>
          </a>
          <a href="study.html" class="menu-card">
              <span class="menu-icon">📚</span>
              <span class="menu-name">テスト対策</span>
              <span class="menu-desc">ノートと予想問題</span>
          </a>
      </nav>

      <div class="dashboard-grid">

          <!-- カレンダー -->
          <section class="calendar-section">
              <h2>📅 カレンダー</h2>
              <div id="calendar"></div>
          </section>

          <!-- 課題一覧 -->
          <section class="task-section">
              <div class="section-header">
                  <h2>📝 やることリスト</h2>
                  <a href="setting.html">⚙️ 得意・苦手の設定はこちら</a>
              </div>

              <div class="table-wrapper">
                  <table>
                      <thead>
                          <tr>
                              <th>課題名</th>
                              <th>締切</th>
                              <th>ステータス</th>
                              <th>操作</th>
                          </tr>
                      </thead>
                      <tbody id="task-list"></tbody>
                  </table>
              </div>
          </section>

      </div>
  </main>

  <!-- 予定編集画面 -->
  <div id="edit-modal" class="modal-overlay">
      <div class="modal-content">

          <div class="modal-header">
              <h2>予定を編集</h2>
              <button id="close-modal" type="button">×</button>
          </div>

          <label for="edit-title">課題名</label>
          <input type="text" id="edit-title">

          <label for="edit-date">取り組む日</label>
          <input type="date" id="edit-date">

          <div class="modal-buttons">
              <button id="delete-event" type="button">
                  予定を削除
              </button>
              <button id="save-event" type="button">
                  変更を保存
              </button>
          </div>

      </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
